pitch: >-
  A flat-pack bay of folding flame-retardant polypropylene panels that two people clip together, without tools, into
  intake, assessment and treatment zones with a one-way path, numbered and worded signs and a magnetic leaf at each
  doorway. Built on the shared Flex platform; supports a receiving team's triage and IPC practice in surge, mass
  casualty and outbreak response. A boundary, not a barrier.
problem: >-
  Triage in surge, mass casualty and outbreak response is improvised with tape, tarps and makeshift barriers; cohorts
  mix, staff lose spatial cues and patients have no clear path. Emergency medical teams need a fast, light bay with
  defined zones, a one-way flow and cues anyone can read.
budget_usd: 800          # value-engineering target per three-zone bay (STANDARDS section 18); stretch under USD 500 at volume (team deck)
difficulty: 3            # 1 easiest, 5 hardest
